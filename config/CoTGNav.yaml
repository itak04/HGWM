task: ObjectNav
agent_cls: CoTGraphAgent
env_cls: WMNavEnv

agent_cfg:
  navigability_mode: 'depth_sensor' # one of ['none' (ours w/o nav), 'depth_estimate' (ZoeDepth), 'segmentation' (Segformer), 'depth_sensor' (Ours)]
  context_history: 0
  explore_bias: 4 
  max_action_dist: 1.7
  min_action_dist: 0.5
  clip_frac: 0.66 # clip action distance to avoid getting too close to obstacles
  stopping_action_dist: 1.5 # length of actions after the agent calls stop
  default_action: 0.2 # how far forward to move if the VLM's chosen action is invalid
  spacing_ratio: 360 # ratio of FOV to theta_delta
  num_theta: 60 # number of angles to consider as actions
  image_edge_threshold: 0.04 # dont project actions if they are within 4% of the image edge
  turn_around_cooldown: 3 # steps before the agent can turn around again
  navigability_height_threshold: 0.2 # threshold from the ground to consider navigable
  map_scale: 100 #pixels per meter
  
  # CoT-Graph specific configurations
  cot_cfg:
    max_qa_rounds: 3
    confidence_threshold: 0.7
    memory_decay_factor: 0.9
    use_scene_memory: true
    use_goal_subgraph: true
    enable_multi_stage_reasoning: true
    panoramic_analysis_mode: "directional_scoring"  # "directional_scoring" or "full_panoramic"
    
  # VLM configuration for vision tasks
  vlm_cfg:
    # model_cls: SiliconFlowVLM
    # model_kwargs:
    #   model: Pro/Qwen/Qwen2.5-VL-7B-Instruct
    # Previous model configuration (commented out):
    model_cls: GeminiVLM
    model_kwargs:
      model: gemini-1.5-pro
      
  # LLM configuration for reasoning tasks  
  llm_cfg:
    llm_model: Pro/Qwen/Qwen2.5-7B-Instruct
    model_cls: SiliconFlowLLM  # Using LLM class for text-only reasoning
    model_kwargs:
      model: Pro/Qwen/Qwen2.5-7B-Instruct  # Pure text model for faster reasoning
      
  panoramic_padding: False

sim_cfg:
  agent_height: 0.88
  agent_radius: 0.18
  allow_slide: true
  use_goal_image_agent: false
  sensor_cfg:
    height: 0.88
    pitch: -0.25
    fov: 79
    img_height: 480
    img_width: 640

env_cfg:
  num_episodes: 1
  max_steps: 40
  log_freq: 1
  split: val
  success_threshold: 1.0
  instances: 1 # Partitions the dataset into this many instances
  instance: 0 # Run on this particular partition of the dataset
  parallel: false
  name: default
  port: 20001 # port for the flask server to aggregate results from instances
