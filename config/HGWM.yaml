task: ObjectNav
agent_cls: HGWMAgent
env_cls: HGWMEnv

agent_cfg:
  navigability_mode: 'depth_sensor'   # one of ['none', 'depth_estimate', 'segmentation', 'depth_sensor']
  context_history: 0
  explore_bias: 4
  max_action_dist: 1.7
  min_action_dist: 0.5
  clip_frac: 0.66                     # clip action distance to keep distance from obstacles
  stopping_action_dist: 1.5           # length of actions after the agent calls stop
  default_action: 0.2                 # fallback forward distance when chosen action is invalid
  spacing_ratio: 360                  # ratio of FOV to theta_delta
  num_theta: 60                       # number of angles to consider as actions
  image_edge_threshold: 0.04
  turn_around_cooldown: 3
  navigability_height_threshold: 0.2
  map_scale: 100                      # pixels per meter

  # Coarse-to-fine graph matching configuration
  hgwm_cfg:
    max_qa_rounds: 3
    confidence_threshold: 0.7
    memory_decay_factor: 0.9
    use_scene_memory: true
    use_goal_subgraph: true
    enable_multi_stage_reasoning: true
    panoramic_analysis_mode: "directional_scoring"   # or "full_panoramic"

  # VLM backbone used for perception and coarse semantic scoring
  vlm_cfg:
    model_cls: GeminiVLM
    model_kwargs:
      model: gemini-1.5-pro

  # LLM reasoner used for goal-prior generation, structural pruning, and arbitration
  llm_cfg:
    llm_model: Pro/Qwen/Qwen2.5-7B-Instruct
    model_cls: SiliconFlowLLM
    model_kwargs:
      model: Pro/Qwen/Qwen2.5-7B-Instruct

  panoramic_padding: False

sim_cfg:
  agent_height: 0.88
  agent_radius: 0.18
  allow_slide: true
  use_goal_image_agent: false
  sensor_cfg:
    height: 0.88
    pitch: -0.25
    fov: 79
    img_height: 480
    img_width: 640

env_cfg:
  num_episodes: 1
  max_steps: 40
  log_freq: 1
  split: val
  success_threshold: 1.0
  instances: 1
  instance: 0
  parallel: false
  name: default
  port: 20001
